<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,400&family=Inter:wght@600;800&family=Lilita+One&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1B3568 0%,#0F2143 50%,#0A1730 100%);color:#F8F5EF;font-family:Inter,system-ui,sans-serif;position:relative}
.glow{position:absolute;left:50%;top:-20%;width:820px;height:820px;transform:translateX(-50%);background:radial-gradient(circle,rgba(246,181,35,.35),rgba(246,181,35,.05) 45%,transparent 70%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 8% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 60%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 78% 18%,#FFE562 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 50%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 8%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 40% 30%,#FFE562 50%,transparent 51%),radial-gradient(1.5px 1.5px at 12% 82%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 78%,#fff 50%,transparent 51%)}
.wrap{position:absolute;left:88px;top:92px;right:88px}
.mark{font-family:'Lilita One',sans-serif;font-size:74px;line-height:1;display:flex;align-items:flex-end}
.mark span{display:inline-block;background:linear-gradient(180deg,#FFE562,#F6B523 55%,#CB9302);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5F0001) drop-shadow(0 6px 0 rgba(95,0,1,.5));transform:translateY(calc(var(--b)*1px)) rotate(calc(var(--r)*1deg))}
.mark small{font-family:Inter;font-weight:800;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:#F8F5EF;margin-left:18px;margin-bottom:10px}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:86px;line-height:1.02;margin:36px 0 0;letter-spacing:-.01em;max-width:1000px}
h1 em{font-style:italic;font-weight:400;background:linear-gradient(180deg,#FFE562,#F6B523 55%,#CB9302);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:28px;font-weight:600;color:rgba(248,245,239,.78);margin:26px 0 0;max-width:720px}
.pill{position:absolute;left:88px;bottom:64px;display:flex;gap:16px}
.pill span{padding:12px 22px;border-radius:999px;border:2px solid rgba(248,245,239,.3);font-weight:800;font-size:20px;letter-spacing:.04em}
.pill span.gold{background:linear-gradient(180deg,#FFE562,#F6B523 55%,#CB9302);color:#0F2143;border-color:transparent}
.castle{position:absolute;right:84px;bottom:52px;width:250px;height:250px;opacity:.95;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
</style></head><body>
<div class="glow"></div><div class="stars"></div>
<div class="wrap">
  <div class="mark"><span style="--b:2;--r:-6">K</span><span style="--b:-2;--r:4">i</span><span style="--b:2;--r:-3">n</span><span style="--b:-3;--r:5">g</span><span style="--b:2;--r:-4">d</span><span style="--b:-2;--r:3">o</span><span style="--b:3;--r:-5">m</span><span style="--b:-2;--r:4">l</span><span style="--b:2;--r:-3">a</span><span style="--b:-3;--r:5">n</span><span style="--b:2;--r:-4">d</span><small>kids</small></div>
  <h1>Biblical adventures for <em>young hearts</em></h1>
  <p>Ad-free Christian streaming for kids 2–10</p>
</div>
<div class="pill"><span class="gold">Try free — no card</span><span>kingdomlandkids.com</span></div>
<svg class="castle" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE562"/><stop offset=".55" stop-color="#F6B523"/><stop offset="1" stop-color="#CB9302"/></linearGradient></defs><path d="M12 44V22l10 8 10-16 10 16 10-8v22z" fill="url(#g)" stroke="#5F0001" stroke-width="1.5" stroke-linejoin="round"/><rect x="12" y="46" width="40" height="6" rx="3" fill="url(#g)" stroke="#5F0001" stroke-width="1.5"/><circle cx="22" cy="30" r="2.2" fill="#fff"/><circle cx="32" cy="24" r="2.2" fill="#fff"/><circle cx="42" cy="30" r="2.2" fill="#fff"/></svg>
</body></html>
