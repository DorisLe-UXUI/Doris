function stuDominant(src){return new Promise((ok,no)=>{const im=new Image();im.onerror=no;im.onload=()=>{try{const n=48,c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d');g.drawImage(im,0,0,n,n);const d=g.getImageData(0,0,n,n).data,bk={};let best=null,any=null;
      for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2];if(d[i+3]<140)continue;const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),sat=mx?(mx-mn)/mx:0;if(mn>232)continue;const k=(r>>4)+','+(gg>>4)+','+(b>>4),x=bk[k]||(bk[k]={n:0,w:0,r:0,g:0,b:0});x.n++;x.w+=.15+sat*sat*(mx>40?1:.3);x.r+=r;x.g+=gg;x.b+=b}
      for(const k in bk){const x=bk[k];if(!best||x.w>best.w)best=x;if(!any||x.n>any.n)any=x}const x=best||any;if(!x)return no(new Error('empty'));let rgb=[x.r/x.n,x.g/x.n,x.b/x.n];
      const hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');let h=hex(rgb),guard=0;while(invLum(h)>.42&&guard++<12){rgb=rgb.map(v=>v*.9);h=hex(rgb)}ok(h.toUpperCase())}catch(e){no(e)}};im.src=src})}

const I18N={lang:'vi',cache:new Map(),done:new WeakMap(),miss:new Set(),keys:new Set()};
try{I18N.lang=localStorage.getItem('bf_lang')==='en'?'en':'vi'}catch(e){}
const TOK=/\d{2}\/\d{2}\/\d{4}|\d{2}\/\d{2}(?!\d)|\d{1,2}:\d{2}|[A-Z]{2,4}-\d{3,6}|\d+(?:\.\d{3})*(?:,\d+)?(?: (?:tr|tỷ)(?=[\s.,;)]|$)|[đk%])?/g;
let nameRe=null,nameSig='';
function buildNames(){const w=W(),s=new Set();[w.products,w.customers,w.suppliers,w.employees,w.branches,DB.businesses].forEach(a=>a.forEach(x=>{if(x.name&&x.name.length>=4)s.add(x.name)}));(w.tables||[]).forEach(t=>s.add(t));const arr=[...s].sort((a,b)=>b.length-a.length),sig=DB.cur+arr.length+arr.slice(0,3).join();if(sig===nameSig)return;nameSig=sig;I18N.cache.clear();nameRe=arr.length?new RegExp(arr.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'):null}
function normKey(str){const names=[],nums=[];let k=str;if(nameRe)k=k.replace(nameRe,m=>{names.push(m);return String.fromCharCode(0xE000+names.length)});k=k.replace(TOK,m=>{nums.push(m);return '#'+nums.length}).replace(/[\uE001-\uE0FF]/g,c=>'§'+(c.charCodeAt(0)-0xE000));return {k,names,nums}}
function enNum(t){if(/^\d{2}\/\d{2}|^\d{1,2}:\d{2}$|^[A-Z]{2,4}-/.test(t))return t;const m=t.match(/^([\d.,]+)( tr| tỷ|[đk%])?$/);if(!m)return t;const n=m[1].replace(/\./g,'\u0001').replace(/,/g,'.').replace(/\u0001/g,','),u=m[2]||'';return u==='đ'?'₫'+n:u===' tr'?n+'M':u===' tỷ'?n+'B':n+u}
const hasWord=s=>/[A-Za-zÀ-ỹ]/.test(s);
function lookup(k){if(k in EN)return EN[k];return null}
function trKey(k){let r=lookup(k);if(r!=null)return r;const parts=k.split(/(\. |; |: | · |, | \(|\))/);if(parts.length>1){let hit=false;const out=parts.map(p=>{const t=p.trim();if(!t||!hasWord(t))return p;const x=lookup(t)??lookup(t.replace(/[.:]$/,''));if(x!=null){hit=true;return p.replace(t,x+(lookup(t)==null?t.slice(-1):''))}return p});if(hit)return out.join('')}
  for(const p of PREFIX)if(k.startsWith(p))return EN[p]+k.slice(p.length);
  // câu ghép từ danh sách: dịch từng mảnh nhỏ
  const U={'hộp':'boxes','cái':'pcs','phần':'servings','gói':'packs','thùng':'cases','lon':'cans','chai':'bottles','ly':'cups','bộ':'sets','suất':'servings','lượt':'sessions','ngày':'days'},seg=t=>{let m;if(lookup(t)!=null)return lookup(t);if(m=t.match(/^(§\d+) còn (#\d+) (\S+)$/))return m[1]+' has '+m[2]+' '+(U[m[3]]||m[3])+' left';if(m=t.match(/^(.*\S) (#\d+)$/)){const h=lookup(m[1])??(/^Trả (§\d+)$/.test(m[1])?'Pay '+m[1].slice(4):null);if(h!=null)return h+' '+m[2]}return t.replace(/(#\d+) (hộp|cái|phần|gói|thùng|lon|chai|ly|bộ|suất|lượt)(?=[\s.;,]|$)/g,(x,n,u)=>n+' '+U[u])};
  const ps=k.split(/(\. |; |: | · |, |\.$)/);let hit2=false;const o2=ps.map(p=>{const t=p.trim();if(!t||!hasWord(t.replace(/[§#]\d+/g,'')))return p;const x=seg(t);if(x!==t)hit2=true;return p.replace(t,x)});return hit2?o2.join(''):null}
function tr(str){const s=str.trim();if(!s||!hasWord(s)&&!/\d/.test(s))return str;if(I18N.cache.has(str))return I18N.cache.get(str);if(I18N.cache.size>6000)I18N.cache.clear();const {k,names,nums}=normKey(s);let out;
  if(window.__collect&&hasWord(k.replace(/[§#]\d+/g,'')))I18N.keys.add(k);
  if(I18N.lang!=='en')return str;
  let t=hasWord(k.replace(/[§#]\d+/g,''))?trKey(k):k;if(t==null){t=k;if(/[À-ỹ]/.test(k))I18N.miss.add(k)}
  out=t.replace(/§(\d+)/g,(_,i)=>names[i-1]??'').replace(/#(\d+)/g,(_,i)=>nums[i-1]!=null?enNum(nums[i-1]):'');out=str.replace(s,out);I18N.cache.set(str,out);return out}
const ATTRS=['placeholder','aria-label','data-tip','alt','title'];
function trNode(n){if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;if(I18N.done.get(n)===n.nodeValue)return;const o=n.nodeValue,t=tr(o);if(t!==o){if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',o.trim());n.nodeValue=t}I18N.done.set(n,n.nodeValue)}
  else if(n.nodeType===1){if(/^(SCRIPT|STYLE)$/.test(n.nodeName)||n.hasAttribute&&n.hasAttribute('data-noi18n'))return;for(const a of ATTRS){if(n.hasAttribute(a)){const o=n.getAttribute(a),t=tr(o);if(t!==o)n.setAttribute(a,t)}}for(let c=n.firstChild;c;c=c.nextSibling)trNode(c)}}
const i18nObs=new MutationObserver(ms=>{if(I18N.lang!=='en'&&!window.__collect)return;buildNames();for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}});
function i18nStart(){i18nObs.observe(document.body,{childList:true,subtree:true,characterData:true});document.documentElement.lang=I18N.lang}
A.lang=()=>{I18N.lang=I18N.lang==='en'?'vi':'en';I18N.cache.clear();try{localStorage.setItem('bf_lang',I18N.lang)}catch(e){}document.documentElement.lang=I18N.lang;S.ai=[];render()};
const langBtn=()=>`<button class="btn sm" data-a="lang" data-noi18n aria-label="${I18N.lang==='en'?'Chuyển sang tiếng Việt':'Switch to English'}"><b style="padding:2px 6px;border-radius:99px;${I18N.lang==='en'?'opacity:.5':'background:var(--c1,#0A5CFF);color:#fff'}">VI</b><b style="padding:2px 6px;border-radius:99px;${I18N.lang==='en'?'background:var(--c1,#0A5CFF);color:#fff':'opacity:.5'}">EN</b></button>`;
const PREFIX=[];
for(const k in EN)if(k.length>=8&&/ $/.test(k)===false&&EN[k]&&PFX.has(k))PREFIX.push(k);PREFIX.sort((a,b)=>b.length-a.length);i18nStart();render();initStore();setTimeout(initBot,900);
</script>
