<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A5CFF"><link rel="icon" href="../img/mark.png"><meta name="description" content="BizFlow: quản lý bán hàng, kho, hóa đơn, lương và dòng tiền cho cửa hàng nhỏ."></head><body><title>BizFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sổ cái của chủ tiệm — thanh điều hướng trái tĩnh lặng, vùng làm việc canh trái; trang chủ là 7 câu hỏi của chủ tiệm kèm câu trả lời bằng chữ lớn. */
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --sunk:#F3F1EA; --ink:#0F1E3D; --ink2:#46546F; --muted:#7F8AA0; --line:#E5E2D8;
  --navy:#0F1E3D; --on-navy:#F4F6FB; --on-navy2:#A9B6D3;
  --blue:#1F5FD6; --blue-soft:#E4EDFC; --mint:#C9EFE3; --mint-ink:#0B6B5C;
  --green:#187A4F; --green-soft:#DCF2E5; --yellow-soft:#FFF0BD; --amber:#8A5A00; --red:#BF3328; --red-soft:#FBE2DF;
  --c1:#1F5FD6; --c2:#0E9384; --c3:#C27A00;
  --shadow:0 1px 2px rgba(15,30,61,.05),0 8px 24px -12px rgba(15,30,61,.14);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#131D31; --sunk:#0F1829; --ink:#EDF1F9; --ink2:#B4BED2; --muted:#7E8AA4; --line:#253149;
  --navy:#1A294A; --on-navy:#F4F6FB; --on-navy2:#A9B6D3;
  --blue:#7AA7FF; --blue-soft:#1A2A4C; --mint:#12392F; --mint-ink:#7FE0C8;
  --green:#62D29C; --green-soft:#13331F; --yellow-soft:#3A3010; --amber:#EDBB52; --red:#FF8A7E; --red-soft:#40201C;
  --c1:#5B8DEF; --c2:#2DB5A2; --c3:#D9A233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#131D31; --sunk:#0F1829; --ink:#EDF1F9; --ink2:#B4BED2; --muted:#7E8AA4; --line:#253149;
  --navy:#1A294A; --on-navy:#F4F6FB; --on-navy2:#A9B6D3;
  --blue:#7AA7FF; --blue-soft:#1A2A4C; --mint:#12392F; --mint-ink:#7FE0C8;
  --green:#62D29C; --green-soft:#13331F; --yellow-soft:#3A3010; --amber:#EDBB52; --red:#FF8A7E; --red-soft:#40201C;
  --c1:#5B8DEF; --c2:#2DB5A2; --c3:#D9A233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center}
.logo i::before{content:"";width:14px;height:14px;border-radius:50% 50% 50% 2px;background:var(--mint);transform:rotate(-45deg)}
:root .logo i::before{background:#C9EFE3}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;color:var(--ink2);text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--navy);color:var(--on-navy)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red-soft);color:var(--red);border-radius:99px;padding:1px 7px;font-weight:600}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 6px;width:auto}
.side .sp{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bizsel{position:relative}
.bizbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px 6px 6px;font-weight:600;max-width:220px}
.bizbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px;z-index:40}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.menu button:hover{background:var(--sunk)}
.menu small{color:var(--muted);display:block}
.search{flex:1;position:relative;max-width:460px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px 8px 36px}
.search svg{position:absolute;left:12px;top:9px;color:var(--muted)}
.search .menu{right:0;max-height:60vh;overflow:auto}
.top .grow{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn b{position:absolute;top:-3px;right:-3px;background:var(--red);color:var(--surface);font-size:10px;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.page{padding-block:24px 96px;padding-inline:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.ph p{color:var(--ink2);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px}
.plain{display:flex;flex-direction:column;gap:10px;min-width:0}
.q{font-size:13px;color:var(--ink2);font-weight:500}
.ans{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero{background:var(--navy);color:var(--on-navy);border:0;border-radius:var(--r-l);padding:24px;grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.hero .q{color:var(--on-navy2)} .hero .big{font-size:44px}
.hero .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:end}
.hero .kv div{border-top:1px solid color-mix(in srgb,var(--on-navy2) 35%,transparent);padding-top:10px}
.hero .kv b{display:block;font-size:17px;font-weight:600} .hero .kv span{color:var(--on-navy2);font-size:12px}
.kpi b{font-size:22px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.2}
.kpi span{color:var(--ink2);font-size:12.5px}
.delta{font-size:12px;font-weight:600}.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)}.pill.warn{background:var(--yellow-soft);color:var(--amber)}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.info{background:var(--blue-soft);color:var(--blue)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.tag.rec{border-color:transparent;background:var(--blue-soft);color:var(--blue)}.tag.est{border-color:transparent;background:var(--yellow-soft);color:var(--amber)}.tag.sug{border-color:transparent;background:var(--mint);color:var(--mint-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--surface)}
:root .btn.pri{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0B1322}}
:root[data-theme="dark"] .btn.pri{color:#0B1322}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,30,61,.12);font-weight:600}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;max-width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:500;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0} tbody tr:hover{background:var(--sunk)}
td.n,th.n{text-align:right;white-space:nowrap} td.click{cursor:pointer;font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
.empty{padding:36px 18px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-size:16px;color:var(--ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--sunk)}
.alert.warn{background:var(--yellow-soft)}.alert.bad{background:var(--red-soft)}.alert.ok{background:var(--green-soft)}
.alert.warn svg{color:var(--amber)}.alert.bad svg{color:var(--red)}.alert.ok svg{color:var(--green)}
.alert small{display:block;color:var(--ink2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}.li .g{flex:1;min-width:0}.li small{color:var(--muted);display:block}
/* charts */
.lc{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.lc .y{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;height:180px}
.lc .plot{position:relative;height:180px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 45px);background-size:100% 100%}
.lc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc .x{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:6px}
.lc .cross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);pointer-events:none}
.lc .dot{position:absolute;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);transform:translate(-50%,-50%);pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--c2);border-radius:4px 4px 0 0;min-height:2px}
.bars div.neg{background:var(--c3)}
.bars div:hover{filter:brightness(1.15)}
.hb{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--c1);border-radius:99px}
.hb .v{font-weight:600;text-align:right;white-space:nowrap}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;max-width:240px;box-shadow:var(--shadow);white-space:pre-line}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(8,14,28,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(100%,560px);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal.wide{width:min(100%,760px)}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,440px);background:var(--surface);z-index:61;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .db{padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:90;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;background:var(--blue-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px}
.chip.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pitem{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:86px}
.pitem:hover{border-color:var(--blue)} .pitem b{font-weight:600;line-height:1.25}.pitem span{color:var(--blue);font-weight:600;margin-top:auto}.pitem small{color:var(--muted)}
.cart{position:sticky;top:76px}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.skel{border-radius:var(--r-m);background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px;text-align:left;font-weight:500}
.opt button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.inv{border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:12px}
.bnav,.fab{display:none}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0;z-index:70;height:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .top{padding:10px 16px}.page{padding-inline:16px;padding-block:16px 150px}
  .bizbtn span{display:none}.bizbtn{padding:5px}
  .hero{grid-template-columns:minmax(0,1fr)}.hero .big{font-size:36px}
  .pos{grid-template-columns:minmax(0,1fr)}.cart{position:static}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:500}
  .bnav button.on{color:var(--blue)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;width:54px;height:54px;border-radius:50%;border:0;background:var(--navy);color:var(--on-navy);box-shadow:var(--shadow);font-size:26px}
  .fabmenu{position:fixed;right:16px;bottom:calc(136px + env(safe-area-inset-bottom,0px));z-index:31;left:auto;top:auto}
  .aifab{bottom:calc(138px + env(safe-area-inset-bottom,0px))!important}
}
.aifab{position:fixed;right:16px;bottom:20px;z-index:29;border:0;background:var(--navy);color:var(--on-navy);border-radius:99px;padding:11px 16px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:var(--shadow)}
.card>.pill,.kpi>.pill,.db>.pill{align-self:flex-start}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
@media (min-width:1000px){.dash{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:880px){.hero .kv b{font-size:14px}.hero .kv{gap:8px}}
/* ---- thương hiệu BizFlow (theo logo): xanh dương chuyển cyan, mint, cam ---- */
:root{--bg:#F6F8FC;--surface:#FFFFFF;--sunk:#EDF1F8;--ink:#06153E;--ink2:#44506E;--muted:#7C87A3;--line:#DFE5F0;--navy:#06153E;--blue:#0A5CFF;--blue-soft:#E3EDFF;--mint:#CFF9EC;--mint-ink:#00796D;--c1:#0A5CFF;--c2:#00A396;--c3:#D97A00;--cyan:#22C3FC;--orange:#FDBC1B}

function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad=(n,l=6)=>String(n).padStart(l,'0');
const vnd=n=>(n<0?'-':'')+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'đ';
const num=n=>{const r=Math.round(n*100)/100;const [a,b]=String(Math.abs(r)).split('.');return (r<0?'-':'')+a.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(b?','+b:'')};
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+num(Math.round(a/1e7)/100)+' tỷ';if(a>=1e6)return s+num(Math.round(a/1e5)/10)+' tr';if(a>=1e3)return s+Math.round(a/1e3)+'k';return s+Math.round(a)};
const dmy=t=>{const d=new Date(t);return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()};
const dm=t=>{const d=new Date(t);return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)};
const hm=t=>{const d=new Date(t);return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)};
const pct=x=>num(Math.round(x*1000)/10)+'%';
const dkey=t=>{const d=new Date(t);return ''+d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2)};
const dayOf=t=>Math.floor((t-T0)/DAY); // 0 = hôm nay, âm = quá khứ

function seedBusiness(cfg){
  cfg.profile.demo=true;const R=rng(cfg.seed), W=newWorkspace(cfg.profile); DB.businesses.push(cfg.profile); DB.ws[cfg.profile.id]=W;
  const bid=cfg.profile.id, stamp=o=>Object.assign(o,{business_id:bid,created_at:o.ts||NOW,updated_at:NOW});
  W.branches=cfg.branches.map(stamp); W.suppliers=cfg.suppliers.map(stamp); W.offers=cfg.offers||[];
  // sản phẩm
  cfg.stock.forEach(s=>{W.seq.p++;W.products.push(stamp({id:s.id,sku:'NL-'+pad(W.seq.p,4),barcode:'893'+pad(Math.floor(R()*1e10),10),name:s.name,cat:s.cat||'Nguyên liệu',kind:'stock',sell:!!s.price,unit:s.unit,buyUnit:s.buyUnit||s.unit,conv:s.conv||1,cost:s.cost,price:s.price||0,
    loc:{main:Math.round(s.stock*(s.wh?0.55:1)*100)/100,wh:Math.round(s.stock*(s.wh?0.45:0)*100)/100},min:s.min,max:s.max,sup:s.sup,expiry:s.exp?T0+s.exp*DAY:null,batch:'L'+pad(Math.floor(R()*9000)+1000,4),status:'Đang bán',w:s.w||0,slow:s.slow}))});
  cfg.menu.forEach(m=>{W.seq.p++;const cost=Object.entries(m.recipe).reduce((a,[k,q])=>a+q*W.products.find(p=>p.id===k).cost,0);
    W.products.push(stamp({id:m.id,sku:'SP-'+pad(W.seq.p,4),barcode:'893'+pad(Math.floor(R()*1e10),10),name:m.name,cat:m.cat,kind:'menu',sell:true,unit:m.unit||'ly',price:m.price,cost:Math.round(cost),recipe:m.recipe,status:'Đang bán',w:m.w,ramp:m.ramp}))});
  // khách hàng
  const nInd=cfg.customers||30;
  for(let i=0;i<nInd+(cfg.companies||0);i++){W.seq.c++;const co=i>=nInd;W.customers.push(stamp({id:'KH-'+pad(W.seq.c),name:co?COMPANIES[i-nInd]:NAMES[i%NAMES.length],phone:'09'+pad(Math.floor(R()*1e8),8),email:co?'ketoan'+(i-nInd+1)+'@congty.vn':'',address:['Q.1','Q.3','Bình Thạnh','Phú Nhuận','TP. Thủ Đức','Q.7'][i%6]+', TP.HCM',company:co,idx:i}))}
  // đơn hàng lịch sử
  const sellable=W.products.filter(p=>p.sell), hoursW=[1,5,9,8,4,3,6,7,4,5,6,5,3,3,2,1]; // 6h..21h
  const pick=(arr,wf)=>{let t=0;for(const a of arr)t+=wf(a);let r=R()*t;for(const a of arr){r-=wf(a);if(r<=0)return a}return arr[arr.length-1]};
  const nowH=new Date().getHours()+new Date().getMinutes()/60;
  for(let d=-HIST;d<=0;d++){
    const date=T0+d*DAY, wd=new Date(date).getDay(), trend=1+0.1*(d+HIST)/HIST;
    let n=Math.round(cfg.perDay*trend*(wd===0||wd===6?1.22:1)*(0.88+R()*0.24)*(d>-30?cfg.recent||1:1));
    const wf=p=>(p.slow&&d>-24?0:p.w)*(p.ramp&&d>-30?p.ramp:1);
    const list=[];
    for(let k=0;k<n;k++){
      const hi=pick(hoursW.map((w,i)=>({w,i})),x=>x.w).i, h=6+hi+R();
      if(d===0&&h>nowH)continue;
      const r=R(), lines=r<.55?1:r<.85?2:r<.95?3:4, items=[];
      for(let j=0;j<lines;j++){const p=pick(sellable,wf);const ex=items.find(i=>i.pid===p.id);if(ex)ex.qty++;else items.push({pid:p.id,qty:R()<.82?1:2,price:p.price,cost:p.cost})}
      let cust=null; if(R()<.28){const cs=W.customers.filter(c=>!c.company&&(c.idx>=nInd-6?d<-45:c.idx>=nInd-10?d>-14:true));cust=pick(cs,c=>1/(1+c.idx*0.35)).id}
      list.push({ts:date+h*36e5,items,cust});
    }
    list.sort((a,b)=>a.ts-b.ts).forEach(o=>{const sub=o.items.reduce((a,i)=>a+i.qty*i.price,0);const r=R();
      addOrderRaw(W,{ts:o.ts,items:o.items,cust:o.cust,discount:0,pay:pick([['cash',40],['bank',38],['wallet',14],['card',8]],x=>x[1])[0],status:r<.008?'cancelled':r<.013?'refunded':'paid',paid:sub,branch:R()<(W.branches.length>2?.3:0)?W.branches[1].id:'main'})});
  }
  // đơn doanh nghiệp (công nợ)
  (cfg.b2b||[]).forEach(b=>{const p=sellable.filter(x=>x.kind==='menu');const items=[];let tot=0;while(tot<b.amt){const x=p[Math.floor(R()*p.length)];const q=5+Math.floor(R()*15);items.push({pid:x.id,qty:q,price:x.price,cost:x.cost});tot+=q*x.price}
    addOrderRaw(W,{ts:T0+b.d*DAY+10*36e5,items,cust:W.customers[nInd+b.c].id,discount:0,pay:'bank',status:b.paid>=1?'paid':'pending',paid:Math.round(tot*b.paid),due:T0+(b.d+15)*DAY,branch:'main',b2b:true})});
  W.orders.sort((a,b)=>a.ts-b.ts);
  // chi phí lịch sử
  W.recurring=cfg.recurring.map(r=>stamp(r));
  const cogsByDay={};W.orders.forEach(o=>{if(o.status==='paid'||o.status==='pending'){const k=dayOf(o.ts);cogsByDay[k]=(cogsByDay[k]||0)+o.cogs}});
  let acc=0;
  for(let d=-HIST;d<=0;d++){const date=T0+d*DAY,D=new Date(date);
    W.recurring.forEach(r=>{if((r.every==='month'&&D.getDate()===r.day)||(r.every==='week'&&D.getDay()===r.day))addExpenseRaw(W,{ts:date+9*36e5,cat:r.cat,amount:Math.round(r.amount*(r.vary?0.9+R()*0.2:1)/1e3)*1e3,note:r.name,rec:true})});
    acc+=cogsByDay[d]||0; if((d+HIST)%3===2){addExpenseRaw(W,{ts:date+8*36e5,cat:'Nguyên liệu / hàng hóa',amount:Math.round(acc*(0.96+R()*0.1)/1e3)*1e3,note:'Nhập hàng định kỳ',sup:W.suppliers[Math.floor(R()*Math.min(4,W.suppliers.length))].id});acc=0}
  }
  W.payables=(cfg.payables||[]).map(p=>stamp({id:'PT-'+pad(Math.floor(R()*9999),4),sup:p.sup,amount:p.amount,due:T0+p.d*DAY,note:p.note}));
  W.employees=(cfg.employees||[]).map((e,i)=>stamp({id:'NV-'+pad(i+1,3),name:e[0],role:e[1],phone:'09'+pad(Math.floor(R()*1e8),8),branch:e[2]||'main',salary:e[3],active:true}));
  W.taxPaid=cfg.taxPaid||[]; W.cash=cfg.cash; W.capital=cfg.capital;
  W.audit=(cfg.audit||[]).map(a=>({ts:T0+a[0]*DAY+a[1]*36e5,who:a[2],what:a[3],from:a[4],to:a[5]}));
  return W;
}
function addOrderRaw(W,o){W.seq.o++;const sub=o.items.reduce((a,i)=>a+i.qty*i.price,0);const total=Math.round(sub*(1-(o.discount||0)/100));
  const rec=Object.assign(o,{id:'DH-'+pad(W.seq.o),inv:(W.settings.invoice.prefix)+'-'+pad(W.seq.o),sub,total,cogs:o.items.reduce((a,i)=>a+i.qty*i.cost,0),paid:o.status==='pending'?(o.paid||0):total,business_id:W.profile.id,created_at:o.ts,updated_at:o.ts});
  W.orders.push(rec);W.dirty=true;(W.tO||(W.tO=new Set())).add(dkey(rec.ts));return rec}
function addExpenseRaw(W,e){W.seq.e++;const rec=Object.assign(e,{id:'CP-'+pad(W.seq.e),business_id:W.profile.id,created_at:e.ts,updated_at:e.ts});W.expenses.push(rec);W.dirty=true;(W.tE||(W.tE=new Set())).add(dkey(rec.ts).slice(0,6));return rec}

// ---- Tổng hợp số liệu ----
const live=o=>o.status==='paid'||o.status==='pending';
function agg(W){ if(!W.dirty&&W._a)return W._a;
  const days={};let lo=-HIST;W.orders.forEach(o=>{const d=dayOf(o.ts);if(d<lo)lo=d});W.expenses.forEach(e=>{const d=dayOf(e.ts);if(d<lo)lo=d});for(let d=lo;d<=0;d++)days[d]={rev:0,n:0,cogs:0,in:0,out:0,exp:0};
  const cs={};
  W.orders.forEach(o=>{const d=days[dayOf(o.ts)];if(!d||!live(o))return;d.rev+=o.total;d.n++;d.cogs+=o.cogs;d.in+=o.paid;
    if(o.cust){const c=cs[o.cust]||(cs[o.cust]={n:0,total:0,first:o.ts,last:0,debt:0});c.n++;c.total+=o.total;c.last=Math.max(c.last,o.ts);c.first=Math.min(c.first,o.ts);c.debt+=o.total-o.paid}});
  W.expenses.forEach(e=>{const d=days[dayOf(e.ts)];if(!d)return;d.out+=e.amount;if(!/Nguyên liệu/.test(e.cat))d.exp+=e.amount});
  W._a={days,cs,lo};W.dirty=false;return W._a}
function sumDays(W,from,to){const a=agg(W).days,r={rev:0,n:0,cogs:0,in:0,out:0,exp:0};for(let d=from;d<=to;d++){const x=a[d];if(x)for(const k in r)r[k]+=x[k]}r.gross=r.rev-r.cogs;r.profit=r.gross-r.exp;r.gm=r.rev?r.gross/r.rev:0;r.nm=r.rev?r.profit/r.rev:0;r.aov=r.n?r.rev/r.n:0;return r}
function byProduct(W,from,to){const m={};W.orders.forEach(o=>{const d=dayOf(o.ts);if(d<from||d>to||!live(o))return;o.items.forEach(i=>{const x=m[i.pid]||(m[i.pid]={pid:i.pid,qty:0,rev:0,cogs:0,last:0});x.qty+=i.qty;x.rev+=i.qty*i.price;x.cogs+=i.qty*i.cost;x.last=Math.max(x.last,o.ts)})});return m}
const P=(W,id)=>W.products.find(p=>p.id===id);
const stockOf=p=>p.loc?Math.round((p.loc.main+p.loc.wh)*1000)/1000:null;
function usage(W,days=14){const u={};W.orders.forEach(o=>{const d=dayOf(o.ts);if(d<-days||d>-1||!live(o))return;o.items.forEach(i=>{const p=P(W,i.pid);if(!p)return;if(p.recipe)for(const k in p.recipe)u[k]=(u[k]||0)+p.recipe[k]*i.qty;else u[p.id]=(u[p.id]||0)+i.qty})});for(const k in u)u[k]/=days;return u}
function invValue(W){return W.products.reduce((a,p)=>a+(p.loc?stockOf(p)*p.cost:0),0)}
function receivables(W){return W.orders.filter(o=>o.status==='pending').map(o=>({o,amt:o.total-o.paid,overdue:o.due<T0}))}
function invStatus(o){if(o.status==='cancelled'||o.status==='refunded')return ['Đã hủy',''];if(o.status==='draft')return ['Nháp',''];if(o.status==='paid')return ['Đã thanh toán','ok'];if(o.due<T0)return ['Quá hạn','bad'];if(o.paid>0)return ['Thanh toán một phần','warn'];return ['Đã phát hành','info']}
function segment(W,c){const s=agg(W).cs[c.id];if(!s)return ['Tiềm năng',''];const dl=(NOW-s.last)/DAY;if(dl>30)return ['Không hoạt động','bad'];if(s.total>=1.2e6&&s.n>=12)return ['VIP','ok'];if(s.total/s.n>=300e3)return ['Giá trị cao','info'];if((NOW-s.first)/DAY<=14)return ['Khách mới','info'];if(s.n>=2)return ['Quay lại','ok'];return ['Tiềm năng','']}

function inventoryInsights(W){const u=usage(W),bp=byProduct(W,-21,0),out=[];
  W.products.filter(p=>p.loc&&p.status==='Đang bán').forEach(p=>{const st=stockOf(p),avg=u[p.id]||0,sup=W.suppliers.find(s=>s.id===p.sup),lead=sup?sup.lead:2,left=avg?st/avg:Infinity;
    const need=avg*(lead+7)-st, sug=need>0?Math.ceil(need/p.conv)*p.conv:0;
    const r={p,st,avg,lead,left,sug,flags:[]};
    if(st<=p.min||left<=lead+1)r.flags.push(['low','Sắp hết hàng','bad']);
    if(p.expiry&&p.expiry-T0<=7*DAY)r.flags.push(['exp','Hết hạn trong '+Math.max(0,Math.round((p.expiry-T0)/DAY))+' ngày','warn']);
    if(p.max&&st>p.max)r.flags.push(['over','Tồn kho quá nhiều','warn']);
    if(p.sell&&!bp[p.id])r.flags.push(['slow','Chưa bán trong 21 ngày','warn']);
    out.push(r)});
  return out}
function fastMovers(W){const a=byProduct(W,-30,-1),b=byProduct(W,-60,-31);return Object.values(a).map(x=>({p:P(W,x.pid),qty:x.qty,g:b[x.pid]&&b[x.pid].qty>150?x.qty/b[x.pid].qty-1:0})).filter(x=>x.p&&x.g>0.25).sort((x,y)=>y.g-x.g)}

// ---- Thuế (ước tính, theo cấu hình) ----
function taxRule(W){return DB.tax.rules.find(r=>r.id===W.profile.taxRule)||DB.tax.rules[3]}
function quarter(off=0){const d=new Date(T0);let q=Math.floor(d.getMonth()/3)+off,y=d.getFullYear();while(q<0){q+=4;y--}const s=new Date(y,q*3,1).getTime(),e=new Date(y,q*3+3,0).getTime();return {q:q+1,y,s,e,label:'Quý '+(q+1)+'/'+y,due:e+DB.tax.dueDays*DAY}}
function taxEstimate(W,Q){const from=Math.max(agg(W).lo,dayOf(Q.s)),to=Math.min(0,dayOf(Q.e)),s=sumDays(W,from,to),r=taxRule(W);
  const annual=sumDays(W,-90,-1).rev/90*365, exempt=r.method==='revenue'&&annual<DB.tax.threshold;
  const vat=r.method==='revenue'?s.rev*r.vat/100:0, pit=r.method==='revenue'?s.rev*r.pit/100:Math.max(0,s.profit)*r.pit/100;
  return {rev:s.rev,profit:s.profit,vat:exempt?0:vat,pit:exempt?0:pit,total:exempt?0:vat+pit,exempt,annual,rule:r,partial:dayOf(Q.s)<agg(W).lo}}

// ---- Dòng tiền & dự báo ----
function fixedMonthly(W){return W.recurring.reduce((a,r)=>a+(r.cat==='Khoản vay'?0:r.amount*(r.every==='week'?4.33:1)),0)}
function forecast(W,n){const a=agg(W).days,wdAvg=[0,0,0,0,0,0,0],wdN=[0,0,0,0,0,0,0];
  for(let d=-28;d<=-1;d++){const wd=new Date(T0+d*DAY).getDay();wdAvg[wd]+=a[d].rev;wdN[wd]++}
  const s30=sumDays(W,-30,-1),cr=s30.rev?s30.cogs/s30.rev:0.4;const rec=receivables(W),Q=quarter(-1),tx=taxEstimate(W,Q),paidQ=W.taxPaid.some(t=>t.label===Q.label);
  let bal=W.cash,min=bal,minDay=0,tin=0,tout=0;const pts=[{d:0,bal}],events=[];
  for(let d=1;d<=n;d++){const date=T0+d*DAY,D=new Date(date);let inn=wdN[D.getDay()]?wdAvg[D.getDay()]/wdN[D.getDay()]:0,out=inn*cr;
    rec.forEach(r=>{if(dayOf(Math.max(r.o.due,T0+DAY))===d){inn+=r.amt;events.push({d,date,in:r.amt,label:'Thu công nợ '+r.o.inv})}});
    W.recurring.forEach(r=>{if((r.every==='month'&&D.getDate()===r.day)||(r.every==='week'&&D.getDay()===r.day)){out+=r.amount;if(r.amount>=3e6)events.push({d,date,out:r.amount,label:r.name})}});
    W.payables.forEach(p=>{if(dayOf(Math.max(p.due,T0+DAY))===d){out+=p.amount;const s=W.suppliers.find(x=>x.id===p.sup);events.push({d,date,out:p.amount,label:'Trả '+(s?s.name:'nhà cung cấp')})}});
    if(!paidQ&&tx.total>0&&dayOf(Q.due)===d){out+=tx.total;events.push({d,date,out:tx.total,label:'Thuế '+Q.label+' (ước tính)'})}
    bal+=inn-out;tin+=inn;tout+=out;pts.push({d,bal});if(bal<min){min=bal;minDay=d}}
  return {pts,events,min,minDay,end:bal,tin,tout}}

function deduct(W,p,q){if(!p.loc)return;p.loc.main=Math.round((p.loc.main-q)*1000)/1000;if(p.loc.main<0){p.loc.wh=Math.round((p.loc.wh+p.loc.main)*1000)/1000;p.loc.main=0}p.updated_at=Date.now()}

  if(payNow){addExpenseRaw(W,{ts:Date.now(),cat:'Nguyên liệu / hàng hóa',amount,note:'Nhập '+p.name,sup:p.sup});W.cash-=amount}else W.payables.push({id:'PT-'+pad(W.payables.length+1,4),sup:p.sup,amount,due:T0+((W.suppliers.find(s=>s.id===p.sup)||{}).terms||7)*DAY,note:'Nhập '+p.name});

MODALS.confirm=(w,m)=>`<div class="modal"><h2>${m.title}</h2><p>${m.body}</p><div class="ft"><button class="btn" data-a="closeOv" data-v="force">Giữ nguyên</button><button class="btn pri" data-a="doConfirm">${m.ok}</button></div></div>`;

PAGES.kho=w=>{const tab=S.tab.kho||'sp',ii=inventoryInsights(w),fl=ii.filter(r=>r.flags.length),q=(S.f.kq||'').toLowerCase(),cat=S.f.kcat||'';

  if(tab==='sp'){const rows=w.products.filter(p=>(!cat||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.barcode.includes(q))),pg=paged('kho',rows,12),sel=Object.keys(S.sel).filter(k=>S.sel[k]);

    ${rows.length?`<div class="tw"><table><thead><tr><th></th><th>Sản phẩm</th><th>Nhóm</th><th class="n">Giá vốn</th><th class="n">Giá bán</th><th class="n">Biên LN</th><th class="n">Tồn kho</th><th>Hạn dùng</th><th>Trạng thái</th><th></th></tr></thead><tbody>${pg.rows.map(p=>{const r=ii.find(x=>x.p===p),st=stockOf(p);return `<tr><td><input type="checkbox" id="sel${p.id}" data-a="sel" data-v="${p.id}" ${S.sel[p.id]?'checked':''} aria-label="Chọn ${esc(p.name)}"></td><td class="click" data-a="modal" data-v="product|${p.id}"><span class="pcell">${thumb(p)}<span>${esc(p.name)}${p.variants?` <span class="tag">${p.variants.length} biến thể</span>`:''}<br><small style="color:var(--muted);font-weight:400">${p.sku} · ${p.barcode}</small></span></span></td><td>${esc(p.cat)}</td><td class="n">${vnd(p.cost)}</td><td class="n">${p.sell?vnd(p.price):'—'}</td><td class="n">${p.sell?pct(1-p.cost/p.price):'—'}</td><td class="n">${p.loc?`<b>${num(st)}</b> ${p.unit}${p.conv>1?`<br><small style="color:var(--muted)">≈ ${num(Math.round(st/p.conv*100)/100)} ${p.buyUnit}</small>`:''}`:'<small style="color:var(--muted)">Theo định lượng</small>'}</td><td>${p.expiry?dmy(p.expiry):'—'}</td><td>${r&&r.flags.length?r.flags.map(f=>pill(f[1],f[2])).join(' '):pill(p.status,p.status==='Đang bán'?'ok':'')}</td><td class="n">${p.loc?`<button class="btn sm" data-a="modal" data-v="purchase|${p.id}">Nhập hàng</button>`:''}</td></tr>`}).join('')}</tbody></table></div>${pg.html}`:empty('Chưa có sản phẩm','Thêm sản phẩm đầu tiên để bắt đầu bán và theo dõi tồn kho.','<button class="btn pri" data-a="modal" data-v="product">Thêm sản phẩm</button>')}`}
  if(tab==='cb')body=fl.length?`<div class="tw"><table><thead><tr><th>Mặt hàng</th><th>Cảnh báo</th><th class="n">Tồn</th><th class="n">Bán/dùng mỗi ngày</th><th class="n">Đủ dùng</th><th class="n">Giao hàng</th><th>Đề xuất</th><th></th></tr></thead><tbody>${fl.map(r=>`<tr><td><b>${esc(r.p.name)}</b></td><td>${r.flags.map(f=>pill(f[1],f[2])).join(' ')}</td><td class="n">${num(r.st)} ${r.p.unit}</td><td class="n">${num(Math.round(r.avg*10)/10)}</td><td class="n">${isFinite(r.left)?num(Math.round(r.left*10)/10)+' ngày':'—'}</td><td class="n">${r.lead} ngày</td><td>${r.sug?`Nhập thêm <b>${num(r.sug/r.p.conv)} ${r.p.buyUnit}</b>${r.p.conv>1?' ('+num(r.sug)+' '+r.p.unit+')':''}`:'Không cần nhập'}</td><td class="n">${r.sug?`<button class="btn sm pri" data-a="modal" data-v="purchase|${r.p.id}|${r.sug/r.p.conv}">Nhập</button>`:''}</td></tr>`).join('')}</tbody></table></div><p class="sub" style="color:var(--muted)">Cách tính: lượng dùng trung bình 14 ngày × (số ngày giao hàng + 7 ngày dự trữ) − tồn hiện tại, làm tròn theo đơn vị mua.</p>`:empty('Kho đang ổn','Không có mặt hàng nào sắp hết, sắp hết hạn hay tồn quá lâu.');

MODALS.product=(w,m)=>{const p=m.id?P(w,m.id):null;return `<div class="modal"><h2>${p?'Sửa sản phẩm':'Thêm sản phẩm'}</h2><div class="form"><label class="f">Tên sản phẩm<input class="inp" id="p_name" value="${esc(p?p.name:'')}"></label><label class="f">Nhóm<input class="inp" id="p_cat" value="${esc(p?p.cat:'')}" placeholder="Ví dụ: Bánh"></label><label class="f">Đơn vị<select class="inp" id="p_unit">${['cái','hộp','chai','lon','kg','gram','lít','combo','suất','phần','ly','gói','bộ'].map(u=>`<option ${p&&p.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="f">Giá vốn (đ)<input class="inp" id="p_cost" type="number" value="${p?p.cost:''}" ${p&&p.recipe?'disabled':''}></label><label class="f">Giá bán (đ)<input class="inp" id="p_price" type="number" value="${p?p.price:''}"></label>${!p||p.loc?`<label class="f">Tồn tối thiểu<input class="inp" id="p_min" type="number" value="${p?p.min:5}"></label>`:''}${!p||p.loc?`<label class="f">Nhà cung cấp<select class="inp" id="p_sup"><option value="">Chưa chọn</option>${w.suppliers.map(s=>`<option value="${s.id}" ${p&&p.sup===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}${p?'':`<label class="f">Đơn vị mua vào<input class="inp" id="p_bu" placeholder="Ví dụ: thùng 24 chai"></label><label class="f">1 đơn vị mua = bao nhiêu đơn vị bán<input class="inp" id="p_conv" type="number" min="1" value="1"></label>`}${p?'':`<label class="f">Tồn đầu kỳ<input class="inp" id="p_stock" type="number" value="0"></label>`}</div>
  ${p&&p.recipe?`<div class="alert">${ic('box')}<span><b>Định lượng mỗi ${p.unit}</b><small>${Object.entries(p.recipe).map(([k,q])=>num(q)+' '+P(w,k).unit+' '+P(w,k).name).join(' · ')}</small><small>Giá vốn tự tính từ giá nhập nguyên liệu.</small></span></div>`:''}${p&&p.conv>1?`<div class="alert">${ic('box')}<span><b>Quy đổi: 1 ${p.buyUnit} = ${p.conv} ${p.unit}</b><small>Bán hoặc dùng lẻ sẽ trừ đúng phần tương ứng.</small></span></div>`:''}
  <div class="ft">${p?`<button class="btn danger" style="margin-right:auto" data-a="confirm" data-v="delprod|${p.id}">Xóa</button>`:''}<button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="saveProduct" data-v="${p?p.id:''}">Lưu sản phẩm</button></div></div>`};
MODALS.purchase=(w,m)=>{const p=P(w,m.id),s=w.suppliers.find(x=>x.id===p.sup);return `<div class="modal"><h2>Nhập hàng: ${esc(p.name)}</h2><p>Nhà cung cấp: ${esc(s?s.name:'Chưa chọn')}. Tồn hiện tại ${num(stockOf(p))} ${p.unit}.</p><div class="form"><label class="f">Số lượng (${p.buyUnit})<input class="inp" id="pu_q" type="number" min="1" value="${m.q||1}"></label><label class="f">Giá mỗi ${p.buyUnit} (đ)<input class="inp" id="pu_p" type="number" value="${p.cost*p.conv}"></label><label class="f">Thanh toán<select class="inp" id="pu_pay"><option value="now">Trả ngay</option><option value="later">Ghi nợ nhà cung cấp</option></select></label></div>${p.conv>1?`<p class="sub">1 ${p.buyUnit} = ${p.conv} ${p.unit}. Tồn kho tăng theo ${p.unit}.</p>`:''}<div class="ft"><button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="savePurchase" data-v="${p.id}">Nhập hàng</button></div></div>`};

DRAWERS.cust=w=>{const c=w.customers.find(x=>x.id===S.drawer.id),s=agg(w).cs[c.id]||{n:0,total:0,debt:0},os=w.orders.filter(o=>o.cust===c.id).reverse();
  return `<div class="dh"><i class="ava">${esc(c.name[0])}</i><span style="flex:1"><b>${esc(c.name)}</b><br><small style="color:var(--muted)">${c.id} · ${c.phone}</small></span><button class="iconbtn" data-a="closeDrawer" aria-label="Đóng">${ic('x')}</button></div><div class="db">${pill(...segment(w,c))}<div class="grid" style="grid-template-columns:1fr 1fr">${kpi('Tổng chi tiêu',vnd(s.total))}${kpi('Số đơn',s.n)}${kpi('TB mỗi đơn',s.n?vnd(s.total/s.n):'—')}${kpi('Còn nợ',vnd(s.debt))}</div><span class="sub" style="color:var(--muted)">${esc(c.address)}${c.email?' · '+esc(c.email):''}</span><h3>Lịch sử giao dịch</h3>${os.length?`<div class="tl">${os.slice(0,25).map(o=>`<div><b>${vnd(o.total)}</b> ${pill(...OST[o.status])}<br><small style="color:var(--muted)">${dmy(o.ts)} ${hm(o.ts)} · ${o.id} · ${o.items.map(i=>i.qty+'× '+esc(P(w,i.pid).name)).join(', ')}</small></div>`).join('')}</div>`:'<span class="sub">Chưa có giao dịch.</span>'}</div>`};
MODALS.customer=()=>`<div class="modal"><h2>Thêm khách hàng</h2><div class="form"><label class="f">Họ tên<input class="inp" id="c_name"></label><label class="f">Số điện thoại<input class="inp" id="c_phone" inputmode="tel"></label><label class="f">Email<input class="inp" id="c_email"></label><label class="f">Địa chỉ<input class="inp" id="c_addr"></label></div><p class="sub">Mã khách hàng được cấp tự động.</p><div class="ft"><button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="saveCustomer">Lưu khách hàng</button></div></div>`;

  `<div class="tw"><table><thead><tr><th>Mã</th><th>Nhà cung cấp</th><th>Liên hệ</th><th>Mặt hàng</th><th class="n">Đã mua (125 ngày)</th><th class="n">Công nợ</th><th>Hạn thanh toán</th><th class="n">Giao hàng</th></tr></thead><tbody>${w.suppliers.map((s,i)=>`<tr><td>NCC-${pad(i+1,3)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.contact)}<br><small style="color:var(--muted)">${s.phone}</small></td><td>${w.products.filter(p=>p.sup===s.id).length}</td><td class="n">${vnd(spent[s.id]||0)}</td><td class="n">${vnd(w.payables.filter(p=>p.sup===s.id).reduce((a,p)=>a+p.amount,0))}</td><td>${s.terms?s.terms+' ngày':'Trả ngay'}</td><td class="n">${s.lead} ngày</td></tr>`).join('')}</tbody></table></div>`};

// ---- HÓA ĐƠN ----
PAGES.hoadon=w=>{const f=S.f.ist||'',cn=id=>(w.customers.find(c=>c.id===id)||{}).name||'Khách lẻ',all=w.orders.concat(w.invoices),rows=all.filter(o=>!f||invStatus(o)[0]===f).sort((a,b)=>b.ts-a.ts),pg=paged('inv',rows,12),rec=receivables(w);
  return head('Hóa đơn','Mỗi đơn bán tự tạo một hóa đơn. Hóa đơn điện tử theo quy định cần kết nối nhà cung cấp được cấp phép.','<button class="btn pri" data-a="modal" data-v="invoice">'+ic('plus')+'Tạo hóa đơn</button>')+
  `<div class="grid g4">${kpi('Chưa thu',vnd(rec.reduce((a,r)=>a+r.amt,0)),`<span>${rec.length} hóa đơn</span>`)}${kpi('Quá hạn',vnd(rec.filter(r=>r.overdue).reduce((a,r)=>a+r.amt,0)),rec.some(r=>r.overdue)?pill('Cần nhắc khách','bad'):pill('Không có','ok'))}${kpi('Hóa đơn điện tử',pill('Chưa kết nối',''),'<span>Xem mục Tích hợp</span>')}</div>
  <div class="chips">${['','Nháp','Đã phát hành','Đã thanh toán','Thanh toán một phần','Quá hạn','Đã hủy'].map(x=>`<button class="chip ${f===x?'on':''}" data-a="filt" data-v="ist|${x}|inv">${x||'Tất cả'}</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Số hóa đơn</th><th>Ngày</th><th>Khách hàng</th><th>Đơn hàng</th><th class="n">Tổng</th><th class="n">Đã thu</th><th>Hạn</th><th>Trạng thái</th><th></th></tr></thead><tbody>${pg.rows.map(o=>`<tr><td class="click" data-a="viewInv" data-v="${o.id}">${o.inv}</td><td>${dmy(o.ts)}</td><td>${esc(cn(o.cust))}</td><td>${o.status==='draft'?'—':o.id}</td><td class="n"><b>${vnd(o.total)}</b></td><td class="n">${vnd(o.paid)}</td><td>${o.status==='pending'?dmy(o.due):'—'}</td><td>${pill(...invStatus(o))}</td><td class="n">${o.status==='pending'?`<button class="btn sm" data-a="modal" data-v="pay|${o.id}">Ghi nhận thu</button>`:o.status==='draft'?`<button class="btn sm" data-a="issue" data-v="${o.id}">Phát hành</button>`:''}</td></tr>`).join('')}</tbody></table></div>${pg.html}`:empty('Không có hóa đơn ở trạng thái này','Chọn trạng thái khác hoặc tạo hóa đơn mới.')}`};
const findInv=(w,id)=>w.orders.find(o=>o.id===id)||w.invoices.find(o=>o.id===id);
MODALS.inv=(w,m)=>{const o=findInv(w,m.id),c=w.customers.find(x=>x.id===o.cust),b=w.profile,r=taxRule(w),tx=r.method==='revenue'?o.total*(r.vat+r.pit)/100:0;
  return `<div class="modal wide"><div class="inv"><div class="ph"><div><h2>${esc(b.name)}</h2><small>${esc(b.address)}<br>MST ${b.mst} · ${b.phone}</small></div><div style="text-align:right"><b>HÓA ĐƠN BÁN HÀNG</b><br><small>Số ${o.inv} · ${dmy(o.ts)}</small><br>${pill(...invStatus(o))}</div></div><span>Khách hàng: <b>${esc(c?c.name:'Khách lẻ')}</b>${c?' · '+c.id:''}</span>
   <div class="tw"><table><thead><tr><th>Sản phẩm</th><th class="n">SL</th><th class="n">Đơn giá</th><th class="n">Thành tiền</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc((P(w,i.pid)||{name:i.name}).name)}</td><td class="n">${i.qty}</td><td class="n">${vnd(i.price)}</td><td class="n">${vnd(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div>
   <div class="list" style="align-self:flex-end;min-width:min(100%,260px)"><div class="li"><span class="g">Tạm tính</span>${vnd(o.sub)}</div>${o.discount?`<div class="li"><span class="g">Giảm giá ${o.discount}%</span>−${vnd(o.sub-o.total)}</div>`:''}${w.settings.invoice.showTax?`<div class="li"><span class="g">Thuế đã gồm (ước tính)</span>${vnd(tx)}</div>`:''}<div class="li"><b class="g">Tổng cộng</b><b>${vnd(o.total)}</b></div><div class="li"><span class="g">Đã thanh toán</span>${vnd(o.paid)}</div></div><small style="color:var(--muted)">${esc(w.settings.invoice.note)} Đây là hóa đơn bán hàng nội bộ, chưa phải hóa đơn điện tử có mã của cơ quan thuế.</small></div>
   <div class="ft"><button class="btn" data-a="dlInv" data-v="${o.id}">Tải PDF</button><button class="btn" data-a="copyInv" data-v="${o.id}">Sao chép nội dung</button><button class="btn pri" data-a="closeOv" data-v="force">Đóng</button></div></div>`};
MODALS.pay=(w,m)=>{const o=findInv(w,m.id);return `<div class="modal"><h2>Ghi nhận thu tiền ${o.inv}</h2><p>Còn phải thu ${vnd(o.total-o.paid)}.</p><label class="f">Số tiền thu (đ)<input class="inp" id="pay_amt" type="number" value="${o.total-o.paid}"></label><div class="ft"><button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="savePay" data-v="${o.id}">Ghi nhận thu</button></div></div>`};
MODALS.invoice=w=>`<div class="modal"><h2>Tạo hóa đơn</h2><div class="form"><label class="f">Khách hàng<select class="inp" id="iv_c">${w.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label class="f">Sản phẩm<select class="inp" id="iv_p">${w.products.filter(p=>p.sell).map(p=>`<option value="${p.id}">${esc(p.name)} · ${vnd(p.price)}</option>`).join('')}</select></label><label class="f">Số lượng<input class="inp" id="iv_q" type="number" min="1" value="10"></label></div><p class="sub">Hóa đơn lưu ở trạng thái Nháp. Khi phát hành, BizFlow tạo đơn hàng, trừ kho và ghi công nợ 15 ngày.</p><div class="ft"><button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="saveInvoice">Lưu nháp</button></div></div>`;

// ---- CHI PHÍ ----
PAGES.chiphi=w=>{const c=S.f.ecat||'',rows=w.expenses.filter(e=>!c||e.cat===c).slice().reverse(),pg=paged('exp',rows,12),by={};w.expenses.forEach(e=>{if(dayOf(e.ts)>=-30)by[e.cat]=(by[e.cat]||0)+e.amount});
  return head('Chi phí','Mọi khoản chi được tự đưa vào dòng tiền và lợi nhuận.','<button class="btn pri" data-a="modal" data-v="expense">'+ic('plus')+'Thêm chi phí</button>')+
  `<div class="grid g2"><div class="card"><h3>Chi trong 30 ngày qua</h3>${Object.keys(by).length?hbars(Object.entries(by).sort((a,b)=>b[1]-a[1]),'var(--c3)'):'<span class="sub">Chưa có khoản chi.</span>'}</div><div class="card"><h3>Chi phí định kỳ</h3><span class="sub">Tự đưa vào dự báo dòng tiền.</span><div class="list">${w.recurring.map(r=>`<div class="li"><span class="g">${esc(r.name)}<small>${r.every==='month'?'Ngày '+r.day+' hàng tháng':'Hàng tuần, '+['Chủ nhật','thứ Hai','thứ Ba','thứ Tư','thứ Năm','thứ Sáu','thứ Bảy'][r.day]}</small></span><b>${vnd(r.amount)}</b></div>`).join('')||'<span class="sub">Chưa có.</span>'}</div></div></div>
  <div class="row"><select class="inp" id="ecat" data-i="ecat"><option value="">Tất cả danh mục</option>${EXP_CATS.map(x=>`<option ${c===x?'selected':''}>${x}</option>`).join('')}</select></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Mã</th><th>Ngày</th><th>Danh mục</th><th>Ghi chú</th><th class="n">Số tiền</th><th></th></tr></thead><tbody>${pg.rows.map(e=>`<tr><td>${e.id}</td><td>${dmy(e.ts)}</td><td>${esc(e.cat)}</td><td>${esc(e.note||'')}${e.rec?' <span class="tag">định kỳ</span>':''}</td><td class="n"><b>${vnd(e.amount)}</b></td><td class="n"><button class="btn sm danger" data-a="confirm" data-v="delexp|${e.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div>${pg.html}`:empty('Chưa có khoản chi nào','Ghi khoản chi đầu tiên để lợi nhuận được tính đúng.')}`};
MODALS.expense=()=>`<div class="modal"><h2>Thêm chi phí</h2><div class="form"><label class="f">Danh mục<select class="inp" id="e_cat">${EXP_CATS.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Số tiền (đ)<input class="inp" id="e_amt" type="number" min="0" placeholder="10000000"></label><label class="f">Ghi chú<input class="inp" id="e_note"></label></div><label class="row"><input type="checkbox" id="e_rec"> Lặp lại hàng tháng vào ngày này</label><div class="ft"><button class="btn" data-a="closeOv" data-v="force">Hủy</button><button class="btn pri" data-a="saveExpense">Lưu chi phí</button></div></div>`;

// ---- DÒNG TIỀN ----
PAGES.dongtien=w=>{const m=sumDays(w,-30,0),open=w.cash-m.in+m.out,f=forecast(w,S.fc),safe=w.settings.safeCash,rec=receivables(w),inS=w.orders.filter(o=>dayOf(o.ts)>=-30&&o.status==='paid'&&!o.b2b).reduce((a,o)=>a+o.total,0),by={};w.expenses.forEach(e=>{if(dayOf(e.ts)>=-30)by[e.cat]=(by[e.cat]||0)+e.amount});
  return head('Dòng tiền','Tiền thật đã vào, đã ra và dự kiến sắp tới.','<button class="btn" data-a="modal" data-v="cashadj">Điều chỉnh tiền hiện có</button>')+
  `<div class="grid g4">${kpi('Tiền đầu kỳ ('+dm(T0-30*DAY)+')',vnd(open))}${kpi('Tiền vào',vnd(m.in),'<span class="delta up">+ trong 30 ngày</span>')}${kpi('Tiền ra',vnd(m.out),'<span class="delta down">− trong 30 ngày</span>')}${kpi('Tiền hiện có',vnd(w.cash))}</div>
  <div class="card"><div class="ph"><h3>Dự báo</h3><div class="seg">${[7,30,60,90].map(n=>`<button class="${S.fc===n?'on':''}" data-a="fc" data-v="${n}">${n} ngày</button>`).join('')}</div></div>
   ${f.min<safe?`<div class="alert ${f.min<0?'bad':'warn'}">${ic('warn')}<span><b>${f.min<0?'Có thể thiếu '+vnd(-f.min):'Tiền có thể xuống còn '+vnd(f.min)} vào ngày ${dmy(T0+f.minDay*DAY)}</b><small>Thấp hơn mức an toàn ${vnd(safe)}. Xem các khoản chi lớn bên dưới để lùi hoặc chia nhỏ.</small></span></div>`:`<div class="alert ok">${ic('check')}<span><b>Dòng tiền ổn định trong ${S.fc} ngày tới</b><small>Số dư dự báo luôn trên mức an toàn ${vnd(safe)}.</small></span></div>`}
   <div class="grid g4"><div class="kpi"><span>Tiền hiện có</span><b>${vnd(w.cash)}</b></div><div class="kpi"><span>Dự kiến thu</span><b style="color:var(--green)">+${vnd(f.tin)}</b></div><div class="kpi"><span>Dự kiến chi</span><b style="color:var(--red)">−${vnd(f.tout)}</b></div><div class="kpi"><span>Số dư cuối kỳ dự báo</span><b>${vnd(f.end)}</b></div></div>
   ${lineChart('fc',f.pts.map(p=>dm(T0+p.d*DAY)),[{name:'Số dư dự báo',color:'var(--c2)',vals:f.pts.map(p=>p.bal)}],{line:safe,lineName:'Mức an toàn'})}
   <span class="sub">Ước tính từ doanh thu trung bình theo thứ trong 4 tuần qua, chi phí định kỳ, công nợ và thuế dự kiến. Không phải cam kết.</span></div>
  <div class="grid g2"><div class="card"><h3>Khoản lớn sắp tới</h3><div class="list">${f.events.slice(0,10).map(e=>`<div class="li"><span class="g">${esc(e.label)}<small>${dmy(e.date)}</small></span><b style="color:var(--${e.in?'green':'red'})">${e.in?'+'+vnd(e.in):'−'+vnd(e.out)}</b></div>`).join('')||'<span class="sub">Không có khoản lớn trong kỳ.</span>'}</div></div>
   <div class="plain"><div class="card"><h3>Tiền vào 30 ngày</h3>${hbars([['Bán hàng',inS],['Thu công nợ',Math.max(0,m.in-inS)],['Thu khác',0]],'var(--c2)')}</div><div class="card"><h3>Tiền ra 30 ngày</h3>${hbars(Object.entries(by).sort((a,b)=>b[1]-a[1]),'var(--c3)')}</div></div></div>`};

// ---- TÀI CHÍNH ----
PAGES.taichinh=w=>{if(!w.orders.length)return head('Tài chính','')+empty('Chưa đủ dữ liệu','Cần có đơn hàng và chi phí để tính lời lỗ và sức khỏe doanh nghiệp.');
  const h=health(w),a=h.a,be=breakEven(w,S.be),lab=[],rv=[],pf=[],df=h.fx/30;for(let i=-11;i<=0;i++){const s=sumDays(w,i*7-6,i*7);lab.push(dm(T0+(i*7-6)*DAY));rv.push(s.rev);pf.push(s.gross-df*7)}
  const st=(ok,warn)=>ok?['Khỏe','ok']:warn?['Cần chú ý','warn']:['Nguy cơ','bad'];
  const H=[['Tăng trưởng doanh thu',pct(h.growth),st(h.growth>0.02,h.growth>-0.05),'Doanh thu 30 ngày qua so với 30 ngày trước đó.'],['Biên lợi nhuận gộp',pct(a.gm),st(a.gm>0.5,a.gm>0.3),'Mỗi 100đ bán ra còn lại '+Math.round(a.gm*100)+'đ sau giá vốn.'],['Biên lợi nhuận ròng',pct(a.nm),st(a.nm>0.12,a.nm>0),'Mỗi 100đ bán ra bạn giữ lại '+Math.round(a.nm*100)+'đ sau mọi chi phí.'],['Vòng quay tồn kho',num(Math.round(h.turn*10)/10)+' lần/năm',st(h.turn>12,h.turn>6),'Hàng trong kho được bán hết và nhập lại khoảng '+Math.round(h.turn)+' lần mỗi năm.'],['Tiền đủ chi trong',isFinite(h.runway)?num(Math.round(h.runway*10)/10)+' tháng':'—',st(h.runway>2,h.runway>1),'Nếu không bán được gì, tiền hiện có trả được chi phí cố định trong ngần ấy thời gian.'],['Tỷ lệ nợ',pct(h.debt),st(h.debt<0.4,h.debt<0.7),'Nợ nhà cung cấp so với tiền, hàng tồn và khoản phải thu.'],['Phụ thuộc khách lớn',pct(h.conc),st(h.conc<0.25,h.conc<0.5),'5 khách lớn nhất chiếm '+pct(h.conc)+' doanh thu.'],['Tỷ lệ chi phí',pct(h.expr),st(h.expr<0.45,h.expr<0.6),'Chi phí vận hành so với doanh thu.']];
  return head('Tài chính','Lời lỗ, sức khỏe doanh nghiệp và điểm hòa vốn, giải thích bằng lời thường.')+
  `<div class="grid g2"><div class="card"><h3>Lời lỗ 30 ngày qua</h3><div class="list"><div class="li"><span class="g">Doanh thu</span><b>${vnd(a.rev)}</b></div><div class="li"><span class="g">Giá vốn hàng bán</span>−${vnd(a.cogs)}</div><div class="li"><b class="g">Lãi gộp</b><b>${vnd(a.gross)}</b></div><div class="li"><span class="g">Chi phí vận hành</span>−${vnd(a.exp)}</div><div class="li"><b class="g">${a.profit>=0?'Đang lời':'Đang lỗ'}</b><b class="big" style="font-size:24px;color:var(--${a.profit>=0?'green':'red'})">${vnd(a.profit)}</b></div></div></div>
   <div class="card"><h3>Doanh thu và lợi nhuận theo tuần</h3>${lineChart('wk',lab,[{name:'Doanh thu',color:'var(--c1)',vals:rv},{name:'Lợi nhuận tạm tính',color:'var(--c2)',vals:pf}])}</div></div>
  <h2 style="font-size:18px">Sức khỏe doanh nghiệp</h2><div class="grid g4">${H.map(x=>`<div class="card kpi"><span>${x[0]}</span><b>${x[1]}</b>${pill(...x[2])}<span>${x[3]}</span></div>`).join('')}</div>
  <div class="card"><h3>Điểm hòa vốn</h3><span class="ans">Bạn cần bán khoảng ${num(Math.ceil(be.orders))} đơn/tháng để hòa vốn. 30 ngày qua bạn bán ${num(be.cur.n)} đơn.</span>
   <div class="form"><label class="f">Chi phí cố định/tháng (đ)<input class="inp" id="be_fixed" type="number" value="${Math.round(be.fixed)}" data-i="beFixed"></label><label class="f">Chi phí biến đổi (% doanh thu)<input class="inp" id="be_vr" type="number" step="0.5" value="${Math.round(be.vr*1000)/10}" data-i="beVr"></label><label class="f">Giá trị trung bình mỗi đơn (đ)<input class="inp" id="be_aov" type="number" value="${Math.round(be.aov)}" data-i="beAov"></label></div>
   <div class="grid g4"><div class="kpi"><span>Doanh thu hòa vốn</span><b>${vnd(be.rev)}/tháng</b></div><div class="kpi"><span>Số đơn hòa vốn</span><b>${num(Math.ceil(be.orders))} đơn</b></div><div class="kpi"><span>Số sản phẩm hòa vốn</span><b>${num(Math.ceil(be.units))}</b></div><div class="kpi"><span>Biên lãi gộp trung bình</span><b>${pct(1-be.vr)}</b></div></div>
   <div class="prog" data-tip="Doanh thu 30 ngày so với điểm hòa vốn"><i style="width:${Math.min(100,be.cur.rev/be.rev*100)}%"></i></div><span class="sub">${be.cur.rev>=be.rev?'Doanh thu 30 ngày qua vượt điểm hòa vốn '+vnd(be.cur.rev-be.rev)+'.':'Còn thiếu '+vnd(be.rev-be.cur.rev)+' doanh thu để hòa vốn.'} Sửa các ô trên để thử kịch bản khác.</span></div>`};

// ---- THUẾ ----
PAGES.thue=w=>{const Q0=quarter(0),Q1=quarter(-1),t0=taxEstimate(w,Q0),t1=taxEstimate(w,Q1),r=taxRule(w),paid1=w.taxPaid.some(x=>x.label===Q1.label),m=sumDays(w,-30,-1),pm=sumDays(w,-60,-31);
  return head('Trung tâm thuế','Số liệu ước tính theo cấu hình thuế bạn chọn.','<button class="btn" data-a="settab" data-v="thue">Sửa cấu hình thuế</button>')+
  `<div class="alert warn">${ic('warn')}<span><b>Thông tin thuế mang tính tham khảo và cần được đối chiếu với quy định hiện hành hoặc chuyên gia thuế.</b><small>BizFlow không thay thế tư vấn kế toán, pháp lý. Thuế suất và ngưỡng doanh thu là cấu hình mẫu, có thể đã thay đổi.</small></span></div>
  <div class="grid g4">${kpi('Doanh thu tính thuế '+Q1.label+' <span class="tag est">ước tính</span>',vnd(t1.rev),t1.partial?'<span>Dữ liệu chưa đủ cả quý</span>':'')}${kpi('Thuế ước tính '+Q1.label,vnd(t1.total),paid1?pill('Đã nộp','ok'):t1.exempt?pill('Dưới ngưỡng','ok'):pill('Chưa nộp, hạn '+dmy(Q1.due),'warn'))}${kpi('Thuế ước tính '+Q0.label+' đến nay',vnd(t0.total),'<span>Doanh thu '+vnd(t0.rev)+'</span>')}${kpi('Đã nộp',vnd(w.taxPaid.reduce((a,x)=>a+x.amount,0)),'<span>'+w.taxPaid.length+' kỳ</span>')}</div>

 weekly:['Bán hàng theo tuần',w=>{const r=[];for(let i=0;i<12;i++){const x=sumDays(w,-i*7-6,-i*7);r.push([dm(T0+(-i*7-6)*DAY)+' – '+dm(T0-i*7*DAY),x.n,vnd(x.rev),vnd(x.gross)])}return [['Tuần','Số đơn','Doanh thu','Lãi gộp'],r]}],
 monthly:['Bán hàng theo tháng',w=>{const m={};w.orders.forEach(o=>{if(!live(o))return;const d=new Date(o.ts),k=pad(d.getMonth()+1,2)+'/'+d.getFullYear();const x=m[k]||(m[k]={n:0,rev:0,cogs:0,t:o.ts});x.n++;x.rev+=o.total;x.cogs+=o.cogs});return [['Tháng','Số đơn','Doanh thu','Lãi gộp'],Object.entries(m).sort((a,b)=>b[1].t-a[1].t).map(([k,x])=>[k,x.n,vnd(x.rev),vnd(x.rev-x.cogs)])]}],

 cash:['Dòng tiền',w=>{const r=[];for(let i=0;i<8;i++){const x=sumDays(w,-i*7-6,-i*7);r.push([dm(T0+(-i*7-6)*DAY)+' – '+dm(T0-i*7*DAY),vnd(x.in),vnd(x.out),vnd(x.in-x.out)])}return [['Tuần','Tiền vào','Tiền ra','Thuần'],r]}],

 cust:['Khách hàng',w=>{const cs=agg(w).cs;return [['Mã','Tên','Nhóm','Số đơn','Tổng chi tiêu','Còn nợ'],w.customers.map(c=>{const s=cs[c.id]||{n:0,total:0,debt:0};return [c.id,c.name,segment(w,c)[0],s.n,vnd(s.total),vnd(s.debt)]})]}],
 sup:['Nhà cung cấp',w=>[['Nhà cung cấp','Liên hệ','Hạn thanh toán','Công nợ'],w.suppliers.map(s=>[s.name,s.contact,s.terms+' ngày',vnd(w.payables.filter(p=>p.sup===s.id).reduce((a,p)=>a+p.amount,0))])]],
 tax:['Thuế (ước tính)',w=>[['Kỳ','Doanh thu','GTGT','TNCN/TNDN','Tổng ước tính'],[quarter(0),quarter(-1)].map(Q=>{const t=taxEstimate(w,Q);return [Q.label,vnd(t.rev),vnd(t.vat),vnd(t.pit),vnd(t.total)]})]],
 exp:['Chi phí',w=>{const by={};w.expenses.forEach(e=>{if(dayOf(e.ts)>=-30){const x=by[e.cat]||(by[e.cat]={n:0,a:0});x.n++;x.a+=e.amount}});return [['Danh mục','Số khoản','Tổng chi 30 ngày'],Object.entries(by).sort((a,b)=>b[1].a-a[1].a).map(([k,x])=>[k,x.n,vnd(x.a)])]}],
 prod:['Hiệu quả sản phẩm',w=>[['Sản phẩm','Số lượng','Doanh thu','Lãi gộp','Biên LN'],Object.values(byProduct(w,-30,-1)).sort((a,b)=>b.rev-a.rev).map(x=>[P(w,x.pid).name,x.qty,vnd(x.rev),vnd(x.rev-x.cogs),pct(1-x.cogs/x.rev)])]]};

function ask(w,q){const s=q.toLowerCase(),a=sumDays(w,-30,-1),b=sumDays(w,-60,-31),R=(t)=>({k:'rec',t}),E=t=>({k:'est',t}),G=t=>({k:'sug',t});

  if(/nhập/.test(s)){const r=inventoryInsights(w).filter(x=>x.sug>0).sort((x,y)=>x.left-y.left).slice(0,5);return r.length?[R(r.map(x=>x.p.name+' còn '+num(x.st)+' '+x.p.unit).join('; ')+'.'),G('Tuần này nên nhập: '+r.map(x=>num(x.sug/x.p.conv)+' '+x.p.buyUnit+' '+x.p.name).join('; ')+'.'),E('Tính theo lượng dùng trung bình 14 ngày và thời gian giao hàng của từng nhà cung cấp.')]:[R('Tồn kho hiện đủ cho ít nhất 7 ngày tới với mọi mặt hàng.')]}
  if(/kho|sắp hết|hết hàng/.test(s)){const r=inventoryInsights(w).filter(x=>x.flags.length);return r.length?[R(r.slice(0,6).map(x=>x.p.name+': '+x.flags.map(f=>f[1].toLowerCase()).join(', ')+' (còn '+num(x.st)+' '+x.p.unit+')').join('; ')+'.'),G('Mở Kho hàng > Cảnh báo để nhập theo số lượng đề xuất.')]:[R('Không có mặt hàng nào sắp hết.')]}
  if(/nhà cung cấp|đủ tiền|trả/.test(s)){const due=w.payables.filter(p=>p.due-T0<=14*DAY).reduce((x,p)=>x+p.amount,0),f=forecast(w,14);return [R('Tiền hiện có '+vnd(w.cash)+'. Phải trả nhà cung cấp trong 14 ngày: '+vnd(due)+'.'),E('Sau khi tính doanh thu dự kiến và các khoản chi khác, số dư thấp nhất trong 14 ngày tới là '+vnd(f.min)+'.'),G(f.min<0?'Chưa đủ. Nên thương lượng lùi một khoản hoặc thu sớm công nợ khách hàng.':f.min<w.settings.safeCash?'Đủ trả nhưng số dư sẽ xuống dưới mức an toàn. Cân nhắc lùi khoản nhập hàng chưa gấp.':'Đủ tiền trả, số dư vẫn trên mức an toàn.')]}
  if(/chi phí/.test(s)){const by={};w.expenses.forEach(e=>{if(dayOf(e.ts)>=-30)by[e.cat]=(by[e.cat]||0)+e.amount});const top=Object.entries(by).sort((x,y)=>y[1]-x[1]).slice(0,4);return [R('Chi nhiều nhất 30 ngày qua: '+top.map(x=>x[0]+' '+vnd(x[1])+' ('+pct(x[1]/a.rev)+' doanh thu)').join('; ')+'.'),G('Khoản đáng xem lại trước: '+top[0][0]+'.')]}
  if(/doanh thu/.test(s)){const x=byProduct(w,-30,-1),y=byProduct(w,-60,-31),d=Object.keys(x).map(k=>({n:P(w,k).name,d:x[k].rev-(y[k]?y[k].rev:0)})).sort((p,q)=>q.d-p.d),g=a.rev/b.rev-1;return [R('Doanh thu 30 ngày qua '+vnd(a.rev)+', '+(g>=0?'tăng ':'giảm ')+pct(Math.abs(g))+' so với 30 ngày trước ('+vnd(b.rev)+').'),R('Tăng nhiều nhất: '+d.slice(0,2).map(z=>z.n+' +'+short(z.d)).join(', ')+'. Giảm nhiều nhất: '+d.slice(-2).map(z=>z.n+' '+short(z.d)).join(', ')+'.'),E('Số đơn '+(a.n>=b.n?'tăng':'giảm')+' từ '+num(b.n)+' lên '+num(a.n)+', giá trị mỗi đơn '+vnd(b.aov)+' → '+vnd(a.aov)+'. Tôi chỉ thấy được số liệu, không biết nguyên nhân bên ngoài như thời tiết hay đối thủ.')]}

function docsFor(w){const b=w.profile.id,core={};CORE.forEach(k=>core[k]=w[k]);core.audit=w.audit.slice(-150);core.transfers=w.transfers.slice(-50);

  w.products.forEach(p=>{if(p.img)out.push([b+'_img_'+p.id,{kind:'img',b,pid:p.id,json:p.img}])});if(w.settings.invoice.logo)out.push([b+'_img_logo',{kind:'img',b,pid:'logo',json:w.settings.invoice.logo}]);

  (w.tE||[]).forEach(k=>out.push([b+'_e_'+k,{kind:'e',b,json:JSON.stringify(w.expenses.filter(e=>dkey(e.ts).slice(0,6)===k))}]));return out}

   sr=(a,b2,st)=>`<div style="display:flex;justify-content:space-between;gap:12px;${st||''}"><span>${a}</span><span>${b2}</span></div>`;
  if(k80)return `<div style="position:relative;width:300px;padding:16px;background:#fff;color:#111;font:12.5px/1.45 ${ff};margin:auto"><div style="text-align:center">${logo?`<div style="display:flex;justify-content:center;margin-bottom:6px">${logo}</div>`:''}<div style="font-weight:700;font-size:16px;color:${col}">${esc(b.name)}</div>${t.tagline?`<div>${esc(t.tagline)}</div>`:''}<div style="color:#555">${esc(b.address||'')}<br>${esc(b.phone||'')}</div><div style="font-weight:700;margin-top:8px">${esc(t.title)}</div><div style="color:#555">${meta}</div>${c?`<div>Khách hàng: <b>${esc(c.name)}</b></div>`:''}</div><div style="border-top:1px dashed #999;margin:8px 0"></div>${items.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${num(i.qty)}× ${nm(i)}${i.disc>0?' <span style="color:#555">(−'+ivPc(i.disc)+'%)</span>':''}</span><span>${vnd(i.qty*i.price)}</span></div>`).join('')}<div style="border-top:1px dashed #999;margin:8px 0"></div>${dAmt>0?sr(dLabel,'−'+vnd(dAmt)):''}${showTax?sr('Thuế đã gồm (ước tính)',vnd(tx),'color:#555'):''}${sr('Tổng cộng',vnd(total),'font-weight:700;font-size:15px')}${sr(draft?'Đã thanh toán':(PAYS[o.pay]||''),(draft?'':'Đã trả ')+vnd(paid))}${rem>0?sr('Còn phải thu',vnd(rem),'font-weight:700'):''}${dueTxt?`<div>${dueTxt}</div>`:''}${memo?`<div style="margin-top:6px">Ghi chú: ${memo}</div>`:''}<div style="text-align:center">${note}</div>${mark}</div>`;
  const hd={modern:`<div style="background:${col};color:#fff;padding:22px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center"><div style="display:flex;gap:14px;align-items:center">${logo?`<div style="background:#fff;border-radius:10px;padding:6px">${logo}</div>`:''}<div><div style="font-size:21px;font-weight:700">${esc(b.name)}</div>${t.tagline?`<div style="opacity:.85">${esc(t.tagline)}</div>`:''}</div></div><div style="text-align:right"><div style="font-weight:700;letter-spacing:.04em">${esc(t.title)}</div><div style="opacity:.85">${meta}</div></div></div>`,
   classic:`<div style="padding:26px 28px 14px;text-align:center;border-bottom:3px double ${col}">${logo?`<div style="display:flex;justify-content:center;margin-bottom:8px">${logo}</div>`:''}<div style="font-size:23px;font-weight:700">${esc(b.name)}</div>${t.tagline?`<div style="font-style:italic;color:#555">${esc(t.tagline)}</div>`:''}<div style="margin-top:10px;font-size:17px;font-weight:700;color:${col};letter-spacing:.08em">${esc(t.title)}</div><div style="color:#555">${meta}</div></div>`,
   minimal:`<div style="padding:26px 28px 12px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid #111">${logo||`<div style="font-size:20px;font-weight:700">${esc(b.name)}</div>`}<div style="text-align:right;color:#555"><div style="color:#111;font-weight:600">${esc(t.title)}</div>${meta}</div></div>`,
   bold:`<div style="padding:26px 28px 6px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div><div style="font-size:34px;font-weight:800;line-height:1;color:${col}">${esc(t.title)}</div><div style="color:#555;margin-top:6px">${meta}</div></div><div style="text-align:right">${logo?`<div style="display:flex;justify-content:flex-end">${logo}</div>`:''}<div style="font-weight:700;font-size:17px">${esc(b.name)}</div>${t.tagline?`<div style="color:#555">${esc(t.tagline)}</div>`:''}</div></div>`}[t.style],td='padding:9px 8px;border-bottom:1px solid #e5e7eb',th=`padding:9px 8px;text-align:left;${t.style==='minimal'?'border-bottom:1px solid #111':'background:'+col+'1A'};font-weight:600`,
   row=(a,b2,st)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0;${st||''}"><span>${a}</span><span>${b2}</span></div>`;
  return `<div style="position:relative;width:100%;max-width:720px;background:#fff;color:#111827;font:13.5px/1.5 ${ff};margin:auto">${hd}<div style="padding:18px 28px 26px"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#374151"><div>${esc(b.address||'')}<br>MST ${esc(b.mst||'—')} · ${esc(b.phone||'')}</div><div style="text-align:right">Khách hàng: <b>${esc(c?c.name:'Khách lẻ')}</b>${c&&(c.id||c.phone)?'<br>'+[c.id,c.phone?esc(c.phone):''].filter(Boolean).join(' · '):''}${dueTxt?'<br>'+dueTxt:''}</div></div>
   <table style="width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px"><tr><th style="${th}">Sản phẩm</th><th style="${th};text-align:right">SL</th><th style="${th};text-align:right">Đơn giá</th>${anyD?`<th style="${th};text-align:right">Giảm</th>`:''}<th style="${th};text-align:right">Thành tiền</th></tr>${items.map(i=>`<tr><td style="${td}">${nm(i)}</td><td style="${td};text-align:right">${num(i.qty)}</td><td style="${td};text-align:right">${vnd(lp(i))}</td>${anyD?`<td style="${td};text-align:right">${i.disc>0?ivPc(i.disc)+'%':''}</td>`:''}<td style="${td};text-align:right">${vnd(i.qty*i.price)}</td></tr>`).join('')}</table>
   <div style="display:flex;justify-content:flex-end;margin-top:14px"><div style="min-width:260px">${row('Tạm tính',vnd(sub))}${dAmt>0?row(dLabel,'−'+vnd(dAmt)):''}${showTax?row('Thuế đã gồm (ước tính)',vnd(tx),'color:#6b7280'):''}<div style="display:flex;justify-content:space-between;margin-top:6px;padding:9px 12px;font-weight:700;font-size:16px;${t.style==='bold'||t.style==='modern'?'background:'+col+';color:#fff;border-radius:8px':'border-top:2px solid '+col}"><span>Tổng cộng</span><span>${vnd(total)}</span></div>${row('Đã thanh toán',vnd(paid),'padding:6px 0 0;color:#374151')}${rem>0?row('Còn phải thu',vnd(rem),'font-weight:700'):''}</div></div>${memo?`<div style="margin-top:14px;padding:10px 12px;background:#f3f4f6;border-radius:8px"><b>Ghi chú:</b> ${memo}</div>`:''}${note}</div>${mark}</div>`};

// ---------- trạng thái trình soạn ----------
const ivLine=()=>({pid:'',vid:'',vn:'',name:'',qty:1,price:0,disc:0,dOk:0});
function ivInit(w,m){if(m.d)return m.d;const dr=m.id?w.invoices.find(x=>x.id===m.id):null,now=Date.now();
  if(!dr){m.id=undefined;return m.d={cust:'',nn:'',np:'',date:iso(now),dateSet:false,due:iso(ivDay(now)+15*DAY),dueSet:false,lines:[ivLine()],dt:'pct',dv:0,dOk:0,note:'',pm:'unpaid',pa:'',meth:'bank',ts:now}}
  const ts=dr.dateSet?dr.ts:now;
  return m.d={cust:dr.cust||'',nn:'',np:'',date:iso(ts),dateSet:!!dr.dateSet,due:iso(dr.dueSet&&dr.due?dr.due:ivDay(ts)+15*DAY),dueSet:!!dr.dueSet,ts,
    lines:(dr.items||[]).map(i=>{const p=i.pid?realP(w,i.pid):null;return {pid:i.free||!i.pid?IV_FREE:i.pid,vid:i.vid||'',vn:i.vn||'',name:i.name||(p?p.name:((w.gone||[]).find(g=>g.id===i.pid)||{}).name||''),qty:i.qty,price:i.list!=null?i.list:i.price,disc:i.disc||0,dOk:i.disc||0,cost:i.cost||0}}),
    dt:dr.discType==='amt'?'amt':'pct',dv:dr.discType==='amt'?(dr.discVal||0):(dr.discVal!=null?dr.discVal:dr.discount||0),dOk:dr.sub?(dr.sub-dr.total)/dr.sub*100:0,note:dr.memo||'',pm:dr.payMode||'unpaid',pa:dr.payAmt||'',meth:dr.payMethod||'bank'}}
const ivValid=l=>(l.pid===IV_FREE?String(l.name||'').trim():l.pid)&&+l.qty>0;
function ivCalc(d){let sub=0;const ls=d.lines.map(l=>{const q=Math.max(0,+l.qty||0),pr=Math.max(0,Math.round(+l.price||0)),dc=Math.max(0,Math.min(100,+l.disc||0)),net=Math.round(pr*(1-dc/100)),tot=ivValid(l)?q*net:0;sub+=tot;return {q,pr,dc,net,tot}});
  const dAmt=d.dt==='amt'?Math.min(sub,Math.max(0,Math.round(+d.dv||0))):sub*Math.max(0,Math.min(100,+d.dv||0))/100,total=Math.max(0,Math.round(sub-dAmt));
  return {ls,sub,total,dAmt:sub-total,pct:sub?(sub-total)/sub*100:0}}
function ivOrder(w,m){const d=m.d,c=ivCalc(d),ts=d.dateSet?dateTs(d.date,d.ts):Date.now(),due=d.dueSet?ivDate(d.due):ivDay(ts)+15*DAY;
  const items=[];d.lines.forEach((l,i)=>{if(!ivValid(l))return;const x=c.ls[i],free=l.pid===IV_FREE,p=free?null:realP(w,l.pid),it={pid:free?null:l.pid,name:String(l.name||'').trim()||(p?p.name:''),qty:x.q,price:x.net,list:x.pr,disc:r1(x.dc),cost:p?(+p.cost||0):(+l.cost||0)};if(free)it.free=1;if(l.vid){it.vid=l.vid;it.vn=l.vn}items.push(it)});
  const pa=d.pm==='full'?c.total:d.pm==='part'?Math.max(0,Math.min(c.total,Math.round(+d.pa||0))):0;
  return {id:m.id||'NHÁP',inv:m.id||'NHÁP',ts,dateSet:!!d.dateSet,status:'draft',cust:d.cust||null,cn:d.cust?'':d.nn.trim(),cp:d.cust?'':d.np.trim(),items,sub:c.sub,total:c.total,discount:r1(c.pct),discType:d.dt,discVal:+d.dv||0,due,dueSet:!!d.dueSet,memo:String(d.note||'').trim(),paid:pa,payMode:d.pm,payAmt:d.pm==='part'?pa:0,payMethod:d.meth,pay:d.meth}}
const ivStockMsg=(w,items)=>{if(allowNeg(w))return '';const need={};items.forEach(i=>{if(i.free||!i.pid)return;const k=i.pid+'|'+(i.vid||'');need[k]=(need[k]||0)+(+i.qty||0)});
  for(const k in need){const[pid,vid]=k.split('|'),p=realP(w,pid);if(!p)continue;const av=availOf(w,p,vid||null);if(isFinite(av)&&need[k]>av+1e-9)return 'Không đủ hàng: '+p.name+' chỉ còn '+num(av)+' '+p.unit+'. Nhập hàng trước, hoặc bật "Cho bán khi hết hàng" trong Cài đặt.'}return ''};
function ivCheck(w,m,issue){const d=m.d,c=ivCalc(d),mx=maxDiscOf(w);
  if(d.lines.some(l=>(l.pid===IV_FREE?String(l.name||'').trim():l.pid)&&!(+l.qty>0)))return 'Số lượng mỗi dòng phải lớn hơn 0';
  if(!d.lines.some(ivValid))return 'Thêm ít nhất một dòng hàng: chọn sản phẩm hoặc nhập mô tả';
  if(d.lines.some((l,i)=>ivValid(l)&&c.ls[i].dc>Math.max(mx,l.dOk||0)+1e-9)||c.pct>Math.max(mx,d.dOk||0)+0.05)return discMsg(w,mx);
  const o=ivOrder(w,m);if(o.due<ivDay(o.ts))return 'Hạn thanh toán phải từ ngày hóa đơn trở đi';
  if(!issue)return '';
  if(!(c.total>0))return 'Tổng hóa đơn phải lớn hơn 0 mới phát hành được';
  if(d.pm==='part'&&!(+d.pa>0&&+d.pa<c.total))return 'Số tiền thu một phần phải lớn hơn 0 và nhỏ hơn tổng hóa đơn';
  if(d.pm!=='full'&&!d.cust&&!d.nn.trim())return 'Chọn khách hàng để ghi công nợ';
  return ivStockMsg(w,o.items)}
function ivCust(w,d){const nn=d.nn.trim();if(d.cust||!nn)return;w.seq.c++;const id='KH-'+pad(w.seq.c);w.customers.push({id,business_id:w.profile.id,created_at:Date.now(),updated_at:Date.now(),name:nn,phone:d.np.trim(),email:'',address:'',idx:99});d.cust=id;d.nn='';d.np=''}
function ivIssue(w,d,id){const pm=d.payMode||'unpaid',meth=d.payMethod||'bank',ts=d.dateSet?d.ts:Date.now(),sub=d.items.reduce((a,i)=>a+i.qty*i.price,0);
  const r=sell(w,{lines:d.items,cust:d.cust||null,discount:sub&&d.total<sub?(sub-d.total)/sub*100:0,discType:d.discType,pay:meth,pending:pm!=='full',ts,due:d.dueSet&&d.due?d.due:ivDay(ts)+15*DAY,memo:d.memo}),o=r.o;
  if(pm==='part'){const a=Math.min(Math.round(+d.payAmt||0),o.total-1);if(a>0)payInvoice(w,o,a,{method:meth,t:ts})}
  if(id){const i=w.invoices.findIndex(x=>x.id===id);if(i>=0)w.invoices.splice(i,1)}
  w.dirty=true;return r}

// ---------- giao diện trình soạn ----------
function ivProdOpts(w,l){const key=l.pid===IV_FREE?IV_FREE:l.pid?l.pid+(l.vid?'|'+l.vid:''):'';let found=!l.pid||l.pid===IV_FREE,h='';
  w.products.filter(p=>p.sell).forEach(p=>{if(p.variants&&p.variants.length)p.variants.forEach(x=>{const k=p.id+'|'+x.id;if(k===key)found=true;h+=`<option value="${k}" ${k===key?'selected':''}>${esc(p.name)} (${esc(x.name)}) · ${vnd(p.price)} · còn ${num(x.stock)}</option>`});else{if(p.id===key)found=true;h+=`<option value="${p.id}" ${p.id===key?'selected':''}>${esc(p.name)} · ${vnd(p.price)}${p.loc?' · còn '+num(stockOf(p)):''}</option>`}});
  const p=found?null:realP(w,l.pid);
  return `<option value="" ${key?'':'selected'}>Chọn sản phẩm…</option><option value="${IV_FREE}" ${key===IV_FREE?'selected':''}>Dòng tự nhập (không trừ kho)</option>${found?'':`<option value="${esc(key)}" selected>${esc(p?p.name:(l.name||'Sản phẩm')+' (đã xóa)')}</option>`}${h}`}
const ivLineTot=x=>`<small>Thành tiền</small>${vnd(x.tot)}`;
MODALS.invoice=(w,m)=>{const d=ivInit(w,m),c=ivCalc(d),o=ivOrder(w,m),mx=maxDiscOf(w);
  return `<div class="modal inved"><div class="ivh"><h2>${m.id?'Sửa hóa đơn nháp '+esc(m.id):'Tạo hóa đơn'}</h2>${pill('Nháp','')}<button class="iconbtn" data-a="closeOv" data-v="force" aria-label="Đóng">${ic('x')}</button></div>
  <div class="ivb"><div class="ivl">
   <div class="ivsec"><h3>Khách hàng và ngày</h3><div class="form"><label class="f">Khách hàng<select class="inp" id="iv_c" data-iv="c"><option value="">Khách lẻ / khách mới</option>${w.customers.map(x=>`<option value="${x.id}" ${d.cust===x.id?'selected':''}>${esc(x.name)}${x.phone?' · '+esc(x.phone):''}</option>`).join('')}</select></label>
    ${d.cust?'':`<label class="f">Tên khách mới<input class="inp" id="iv_nn" data-iv="nn" value="${esc(d.nn)}" placeholder="Bỏ trống nếu là khách lẻ"></label><label class="f">Số điện thoại khách mới<input class="inp" id="iv_np" data-iv="np" inputmode="tel" value="${esc(d.np)}"></label>`}
    <label class="f">Ngày hóa đơn<input class="inp" id="iv_date" type="date" data-iv="date" max="${iso(Date.now())}" value="${d.date}"></label><label class="f">Hạn thanh toán<input class="inp" id="iv_due" type="date" data-iv="due" value="${d.due}"></label></div></div>
   <div class="ivsec"><h3>Dòng hàng</h3>${d.lines.map((l,i)=>`<div class="ivline"><div class="r1"><label class="f">Sản phẩm<select class="inp" id="iv_l${i}_p" data-iv="p" data-ix="${i}">${ivProdOpts(w,l)}</select></label><label class="f ds">Mô tả trên hóa đơn<input class="inp" id="iv_l${i}_n" data-iv="n" data-ix="${i}" value="${esc(l.name)}" placeholder="Ví dụ: Phí giao hàng"></label><button class="ivx" data-a="ivDel" data-v="${i}" aria-label="Xóa dòng">${ic('x')}</button></div>
     <div class="r2"><label class="f">Số lượng<input class="inp" id="iv_l${i}_q" type="number" min="0" step="any" inputmode="decimal" data-iv="q" data-ix="${i}" value="${esc(l.qty)}"></label><label class="f">Đơn giá (đ)<input class="inp" id="iv_l${i}_pr" type="number" min="0" step="any" inputmode="numeric" data-iv="pr" data-ix="${i}" value="${esc(l.price)}"></label><label class="f">Giảm (%)<input class="inp" id="iv_l${i}_d" type="number" min="0" max="100" step="any" inputmode="decimal" data-iv="d" data-ix="${i}" value="${esc(l.disc)}"></label><div class="lt" id="iv_lt${i}">${ivLineTot(c.ls[i])}</div></div></div>`).join('')}
    <button class="btn" style="align-self:flex-start" data-a="ivAdd">${ic('plus')}Thêm dòng</button></div>
   <div class="ivsec"><h3>Giảm giá và ghi chú</h3><div class="form"><label class="f">Giảm giá cả hóa đơn<select class="inp" id="iv_dt" data-iv="dt"><option value="pct" ${d.dt==='pct'?'selected':''}>Theo phần trăm (%)</option><option value="amt" ${d.dt==='amt'?'selected':''}>Theo số tiền (đ)</option></select></label><label class="f">${d.dt==='amt'?'Số tiền giảm (đ)':'Phần trăm giảm (%)'}<input class="inp" id="iv_dv" type="number" min="0" step="any" inputmode="decimal" data-iv="dv" value="${esc(d.dv)}"></label></div>${mx<100?`<span class="sub">${esc(roleOf(w))} được giảm tối đa ${num(mx)}%.</span>`:''}
    <label class="f">Ghi chú trên hóa đơn<textarea class="inp" id="iv_note" rows="2" data-iv="note" placeholder="Ví dụ: Giao hàng trong 3 ngày, bảo hành 12 tháng">${esc(d.note)}</textarea></label>
    <div class="ivsum"><div><span>Tạm tính</span><span id="iv_s_sub">${vnd(c.sub)}</span></div><div><span>Giảm giá</span><span id="iv_s_disc">−${vnd(c.dAmt)}</span></div><div class="tt"><span>Tổng cộng</span><span id="iv_s_total">${vnd(c.total)}</span></div></div></div>
   <div class="ivsec"><h3>Thanh toán khi phát hành</h3><div class="form"><label class="f">Tình trạng<select class="inp" id="iv_pm" data-iv="pm"><option value="unpaid" ${d.pm==='unpaid'?'selected':''}>Chưa thu, ghi công nợ</option><option value="part" ${d.pm==='part'?'selected':''}>Thu một phần</option><option value="full" ${d.pm==='full'?'selected':''}>Đã thu đủ</option></select></label>
    ${d.pm==='part'?`<label class="f">Số tiền đã thu (đ)<input class="inp" id="iv_pa" type="number" min="0" step="any" inputmode="numeric" data-iv="pa" value="${esc(d.pa)}"></label>`:''}${d.pm!=='unpaid'?`<label class="f">Hình thức<select class="inp" id="iv_meth" data-iv="meth">${Object.entries(PAYS).map(([k,v])=>`<option value="${k}" ${d.meth===k?'selected':''}>${v}</option>`).join('')}</select></label>`:''}</div>
    <span class="sub" id="iv_rem">${ivRemTxt(o)}</span></div>
  </div><div class="ivr"><div class="row" style="justify-content:space-between"><h3>Xem trước hóa đơn</h3><span class="sub">Tự cập nhật khi bạn sửa</span></div><div class="paper ivfit" id="iv_prev"><div class="ivz">${invoiceHTML(w,o)}</div></div><span class="sub">Bản nháp có chữ NHÁP mờ. Khi phát hành, hóa đơn nhận số chính thức, trừ kho các dòng sản phẩm và ghi công nợ phần chưa thu.</span></div></div>
